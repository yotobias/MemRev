[project]
name = "memrev"
version = "0.1.0"
description = "Pilot B: assumption applicability of agent lessons across repository revisions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.15,<2",
]

[project.scripts]
memrev = "memrev.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
